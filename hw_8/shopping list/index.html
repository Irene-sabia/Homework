<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hw_8</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1 class="title title-1">CSS Dinner Shopping List</h1>
            <h2 class="title title-2">Let’s go to the mall!</h2>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <form action="#" method="get" class="form">
                <div class="form-items">
                    <label class="label">
                        <input type="checkbox" class="input">
                        <span class="input-check"></span>
                        <span class="input-text">A lot of pickles <span class="input-text small">(for the next lessons
                                about CSS)</span></span>
                    </label>
                </div>
                <div class="form-items">
                    <label class="label">
                        <input type="checkbox" class="input">
                        <span class="input-check"></span>
                        <span class="input-text">10 apples <span class="input-text small">(for more CSS
                                manipulations)</span></span>
                    </label>
                </div>
                <div class="form-items">
                    <label class="label">
                        <input type="checkbox" class="input">
                        <span class="input-check"></span>
                        <span class="input-text"> 20 oranges <span class="input-text small">(because they are
                                awesome)</span> </span>
                    </label>
                </div>
                <div class="form-items">
                    <label class="label">
                        <input type="checkbox" class="input">
                        <span class="input-check"></span>
                        <span class="input-text">13 plates <span class="input-text small">(hm... they always
                                dissapear)</span> </span>
                    </label>
                </div>
                <div class="form-items">
                    <label class="label">
                        <input type="checkbox" class="input">
                        <span class="input-check"></span>
                        <span class="input-text">15 bentos</span>
                    </label>
                </div>
                <div class="form-items">
                    <label class="label">
                        <input type="checkbox" class="input">
                        <span class="input-check"></span>
                        <span class="input-text">1 bottle of Sake <span class="input-text small">(for my
                                friends)</span></span>
                    </label>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <h3 class="title title-3">Bon appetit :)</h3>
        </div>
    </footer>

</body>

</html>
